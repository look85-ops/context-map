name: digest

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        run: python src/curator.py
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push
        run: |
          git config --global user.name "context-bot"
          git config --global user.email "bot@look85-ops.github.io"
          git pull --rebase origin main
          git add -A
          git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push
