name: hunt

on:
  schedule:
    - cron: "0 6,16 * * *"  # 9:00 и 19:00 Минск (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Apartment Hunter
        run: python src/apt_hunter.py
        env:
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push
        run: |
          git config --global user.name "apt-bot"
          git config --global user.email "bot@look85-ops.github.io"
          git add index.html artifacts/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "hunt: $(date +%Y-%m-%d_%H:%M)"
          git pull --rebase origin main
          git push